<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>e-NCA - User Management</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="app-header">
        <div>
            <div class="app-title">e-NCA</div>
            <div class="app-subtitle">User Management</div>
        </div>

        <div class="header-user">
            <span id="header-user-name"></span>
            <span id="header-user-role"></span>

            <button
                type="button"
                id="back-button"
                class="btn btn-secondary">
                Back
            </button>

            <button
                type="button"
                id="logout-button"
                class="btn btn-danger">
                Logout
            </button>
        </div>
    </header>


    <!-- PAGE -->
    <main class="page-container">

        <div class="page-title-row">

            <div>
                <h1>User Management</h1>
                <p class="page-description">
                    Manage e-NCA user accounts, roles, departments and work areas.
                </p>
            </div>

            <button
                type="button"
                id="add-user-button"
                class="btn btn-primary">
                + Add User
            </button>

        </div>


        <!-- FILTER -->
        <section class="content-card">

            <div class="section-title">
                User List
            </div>

            <div class="user-filter-grid">

                <div class="form-group">
                    <label>Search</label>

                    <input
                        type="text"
                        id="user-search"
                        placeholder="Badge ID / Name / Email">
                </div>


                <div class="form-group">
                    <label>Department</label>

                    <select id="filter-department">
                        <option value="">All Departments</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Job Position</label>
                    <select id="filter-job-position">
                        <option value="">All Job Positions</option>
                    </select>
                </div>


                <div class="form-group">
                    <label>Role</label>

                    <select id="filter-role">
                        <option value="">All Roles</option>
                    </select>
                </div>


                <div class="form-group">
                    <label>Area</label>

                    <select id="filter-area">

                        <option value="">
                            All Areas
                        </option>

                        <option value="Injection">
                            Injection
                        </option>

                        <option value="MCX Harness">
                            MCX Harness
                        </option>

                        <option value="MHF Harness">
                            MHF Harness
                        </option>

                        <option value="Connector Assy">
                            Connector Assy
                        </option>

                        <option value="General">
                            General
                        </option>

                    </select>
                </div>


                <div class="form-group">
                    <label>Status</label>

                    <select id="filter-status">

                        <option value="">
                            All Status
                        </option>

                        <option value="true">
                            Active
                        </option>

                        <option value="false">
                            Inactive
                        </option>

                    </select>
                </div>

            </div>

        </section>


        <!-- USER TABLE -->
        <section class="content-card">

            <div class="table-wrapper">

                <table class="user-table">

                    <thead>
                        <tr>

                            <th>No.</th>
                            <th>Badge ID</th>
                            <th>Full Name</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Job Position</th>
                            <th>Role</th>
                            <th>Area</th>
                            <th>Status</th>
                            <th>Action</th>

                        </tr>
                    </thead>

                    <tbody id="user-table-body">

                        <tr>
                            <td
                                colspan="10"
                                class="table-loading">
                                Loading users...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>


<!-- USER MODAL -->

<div
    id="user-modal"
    class="modal-overlay"
    style="display:none;">

    <div class="user-modal">

        <div class="modal-header">

            <div>
                <h2 id="modal-title">
                    Add User
                </h2>

                <div class="modal-subtitle">
                    User account information
                </div>
            </div>

            <button
                type="button"
                id="modal-close"
                class="modal-close">
                ×
            </button>

        </div>


        <form id="user-form">

            <input
                type="hidden"
                id="user-id">


            <div class="form-grid-2">

                <div class="form-group">

                    <label>
                        Badge ID <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="badge-id"
                        required
                        maxlength="50">

                </div>


                <div class="form-group">

                    <label>
                        Full Name <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="full-name"
                        required
                        maxlength="150">

                </div>


                <div class="form-group">

                    <label>
                        Email <span class="required">*</span>
                    </label>

                    <input
                        type="email"
                        id="email"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Department
                    </label>

                    <select id="department-id">
                        <option value="">
                            Select Department
                        </option>
                    </select>
             </div>
                
                <div class="form-group">
                        <label>
                            Job Position
                        </label>

                        <select id="job-position-id">
                            <option value="">
                                Select Job Position
                            </option>
                        </select>
                 </div>

               


                <div class="form-group">

                    <label>
                        Role <span class="required">*</span>
                    </label>

                    <select id="role-id" required>
                        <option value="">
                            Select Role
                        </option>
                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Work Area
                    </label>

                    <select id="area">

                        <option value="">
                            Select Area
                        </option>

                        <option value="Injection">
                            Injection
                        </option>

                        <option value="MCX Harness">
                            MCX Harness
                        </option>

                        <option value="MHF Harness">
                            MHF Harness
                        </option>

                        <option value="Connector Assy">
                            Connector Assy
                        </option>

                        <option value="General">
                            General
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-group">

                <label>
                    Status
                </label>

                <label class="switch-label">

                    <input
                        type="checkbox"
                        id="active"
                        checked>

                    <span>
                        Active User
                    </span>

                </label>

            </div>


            <div
                id="user-form-message"
                class="form-message">
            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    id="cancel-user"
                    class="btn btn-secondary">
                    Cancel
                </button>

                <button
                    type="submit"
                    class="btn btn-primary">
                    Save User
                </button>

            </div>

        </form>

    </div>

</div>


<script type="module" src="../js/user-management.js"></script>

</body>
</html>
