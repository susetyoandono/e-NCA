<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>e-NCA | Create NCA</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>

    <!-- =========================
         HEADER
         ========================= -->

    <header class="app-header">

        <div class="header-left">

            <div class="app-title">
                e-NCA
            </div>

            <div class="app-subtitle">
                Electronic Non-Conformance Application
            </div>

        </div>


        <div class="header-right">

            <div class="user-info">

                <strong id="user-name">
                    Loading...
                </strong>

                <span id="user-role">
                    Loading...
                </span>

            </div>


            <button
                id="logout-button"
                class="logout-button"
            >
                Logout
            </button>

        </div>

    </header>


    <!-- =========================
         MAIN
         ========================= -->

    <main class="container">


        <div class="page-header">

            <div>

                <h1>
                    Create New NCA
                </h1>

                <p>
                    Create a new Non-Conformance record
                </p>

            </div>


            <button
                id="back-button"
                class="secondary-button"
            >
                ← Back to Dashboard
            </button>

        </div>


        <!-- =========================
             FORM
             ========================= -->

        <section class="form-card">

            <div class="form-section-title">
                NCA Information
            </div>


            <div class="form-grid">


                <!-- NCA NUMBER -->

                <div class="form-field">

                    <label>
                        NCA Number
                    </label>

                    <input
                        type="text"
                        id="nca-number"
                        readonly
                    >

                </div>


                <!-- CREATED BY -->

                <div class="form-field">

                    <label>
                        Created By
                    </label>

                    <input
                        type="text"
                        id="created-by"
                        readonly
                    >

                </div>


                <!-- DEFECT NAME -->

                <div class="form-field full-width">

                    <label for="defect-name">
                        Defect Name
                        <span class="required">
                            *
                        </span>
                    </label>

                    <input
                        type="text"
                        id="defect-name"
                        placeholder="Enter defect name"
                        required
                    >

                </div>


                <!-- DESCRIPTION -->

                <div class="form-field full-width">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        rows="5"
                        placeholder="Enter defect description"
                    ></textarea>

                </div>


            </div>


            <!-- =========================
                 FORM ACTION
                 ========================= -->

            <div class="form-actions">

                <button
                    type="button"
                    id="cancel-button"
                    class="secondary-button"
                >
                    Cancel
                </button>


                <button
                    type="button"
                    id="save-button"
                    class="primary-button"
                >
                    Save NCA
                </button>

            </div>


            <div
                id="form-message"
                class="form-message"
            ></div>

        </section>

    </main>


    <script
        type="module"
        src="../js/create-nca.js"
    ></script>

</body>

</html>
