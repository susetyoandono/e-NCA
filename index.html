<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>e-NCA | IPEX Indonesia</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="app-header">
        <div>
            <h1>e-NCA</h1>
            <p>Electronic Non-Conformance Application</p>
        </div>
    </header>

    <main class="container">

        <section class="welcome-card">
            <h2>Welcome to e-NCA</h2>

            <p>
                Electronic Non-Conformance Application
            </p>

            <div id="connection-status">
                Checking system connection...
            </div>
            <hr style="margin: 20px 0;">
            <h3>Buat DRAFT NCA</h3>
            <form id="form-nca" style="margin-top: 15px;">
                <input type="text" id="nca-number" placeholder="Nomor NCA (Contoh: NCA-260912001)" required style="padding: 10px; width: 100%; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px;">
                <button type="submit" style="padding: 10px 20px; background: #0b3a63; color: white; border: none; border-radius: 4px; cursor: pointer;">Create NCA</button>
            </form>
        </section>

    </main>

    <footer>
        <p>PT I-PEX Indonesia Inc.</p>
    </footer>

    <script type="module" src="js/app.js"></script>

</body>
</html>
